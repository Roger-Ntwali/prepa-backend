name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Matches docker-compose.yml's local dev credentials -- test/env.setup.js
    # and the pretest migrate script both point at prepa_test on this same
    # user/password/port, so nothing else needs configuring here.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prepa_user
          POSTGRES_PASSWORD: prepa_pass
          POSTGRES_DB: prepa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U prepa_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # undici@8.9.0 requires Node >=22.19.0 (declared in its own
          # package.json engines field) -- Node 20 installs it anyway (npm
          # only warns, EBADENGINE isn't fatal by default) but crashes at
          # require-time the moment anything touches it: `new CacheStorage`
          # inside undici calls a webidl helper that doesn't exist before
          # Node 22.19. This was silent locally because dev machines run a
          # much newer Node than whatever CI pins.
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm audit --omit=dev --audit-level=high

      - run: npm test
